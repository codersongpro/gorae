<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icons/icon32.png">
<title>고래곳간 실행</title>
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/app.css">
<style>
  /* 새 탭 실행 화면: 위 띠 + 작품이 화면 전체 */
  body { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  #app { max-width: none; padding: 0; }
  .runbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-4); background: var(--color-surface); border-bottom: var(--border-width) solid var(--color-border); }
  .runbar h1 { font-size: var(--font-size-lg); margin: 0; }
  #frame { border: 0; width: 100%; height: 100%; background: var(--color-bg); }
</style>
</head>
<body>
<header class="runbar" id="bar"><h1>🐳 고래곳간</h1><span class="muted" id="state">작품을 불러오는 중…</span></header>
<iframe id="frame" title="작품 실행" hidden></iframe>
<script type="module" src="run.js"></script>
</body>
</html>
