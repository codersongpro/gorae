<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교 일정 D-day 보드</title>
<style>
  :root { --b: #3366ff; --tx: #171719; --mu: #5a5c63; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f7f7f8; color: var(--tx); font: 16px/1.6 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; } .sub { margin: 2px 0 0; color: var(--mu); font-size: .9rem; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(23,23,23,.08); display: grid; gap: 8px; }
  .add { display: grid; grid-template-columns: 1fr 10em auto; gap: 8px; } @media (max-width: 560px) { .add { grid-template-columns: 1fr; } }
  input[type=text], input[type=date] { font: inherit; padding: 8px 10px; border: 1px solid #e1e2e4; border-radius: 10px; width: 100%; }
  button { font: inherit; font-weight: 700; min-height: 46px; padding: 0 16px; border: 1px solid #e1e2e4; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); border-color: var(--b); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid #7aa0ff; outline-offset: 2px; }
  .ev { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #eee; }
  .dd { text-align: center; font-weight: 800; font-size: 1.15rem; border-radius: 10px; padding: 4px 6px; background: #eef2ff; color: #0054d1; }
  .ev.soon .dd { background: #ffe9e9; color: #b00c0c; } .ev.today .dd { background: #b00c0c; color: #fff; } .ev.past { opacity: .5; } .ev.past .dd { background: #eee; color: var(--mu); }
  .ev small { color: var(--mu); display: block; } .ev button { min-height: 36px; padding: 0 10px; font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>📆 학교 일정 D-day 보드</h1><p class="sub">제출 마감, 행사, 시험 같은 일정을 넣으면 남은 날을 가까운 순서로 보여 줘요. 일정은 이 화면 안에서만 쓰여요.</p></header>
  <section class="card" aria-label="일정 추가">
    <div class="add"><input type="text" id="t" placeholder="예: 안전교육 결과 제출" aria-label="일정 제목"><input type="date" id="d" aria-label="날짜"><button class="p" id="add">추가</button></div>
    <div><button id="tpl">예시 일정 넣기</button> <button id="copy">목록 복사</button></div>
  </section>
  <section class="card" aria-label="일정 목록"><div id="list" aria-live="polite"></div></section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const day = (v) => new Date(v + 'T00:00:00');
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let ev = [];
  const diff = (v) => Math.round((day(v) - today()) / 86400000);
  function draw() {
    const list = $('list'); list.textContent = '';
    if (!ev.length) { list.textContent = '일정을 추가해 보세요.'; return; }
    [...ev].sort((a, b) => (diff(a.d) < 0) - (diff(b.d) < 0) || diff(a.d) - diff(b.d)).forEach((e) => {
      const n = diff(e.d), row = document.createElement('div');
      row.className = 'ev' + (n < 0 ? ' past' : n === 0 ? ' today' : n <= 3 ? ' soon' : '');
      const dd = document.createElement('div'); dd.className = 'dd'; dd.textContent = n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`;
      const t = document.createElement('div'); t.textContent = e.t; const s = document.createElement('small'); s.textContent = `${day(e.d).getMonth() + 1}월 ${day(e.d).getDate()}일 (${'일월화수목금토'[day(e.d).getDay()]})`; t.appendChild(s);
      const x = document.createElement('button'); x.textContent = '삭제'; x.setAttribute('aria-label', `${e.t} 삭제`); x.onclick = () => { ev = ev.filter((v) => v !== e); draw(); };
      row.append(dd, t, x); list.appendChild(row);
    });
  }
  $('add').onclick = () => { const t = $('t').value.trim(), d = $('d').value; if (!t || !d) return; ev.push({ t, d }); $('t').value = ''; draw(); };
  $('tpl').onclick = () => { const b = today(); const add = (n, t) => { const x = new Date(b); x.setDate(x.getDate() + n); ev.push({ t, d: iso(x) }); }; add(2, '안전교육 결과 제출'); add(9, '학부모 상담 주간 시작'); add(16, '현장체험학습'); add(30, '학년 말 평가 계획 제출'); draw(); };
  $('copy').onclick = async () => { const t = [...ev].sort((a, b) => diff(a.d) - diff(b.d)).map((e) => `${e.d} ${e.t} (D${diff(e.d) >= 0 ? '-' + diff(e.d) : '+' + -diff(e.d)})`).join('\n'); try { await navigator.clipboard.writeText(t); $('copy').textContent = '복사했어요 ✓'; } catch { $('copy').textContent = '복사하지 못했어요'; } setTimeout(() => { $('copy').textContent = '목록 복사'; }, 1800); };
  $('tpl').click();
</script>
</body>
</html>
