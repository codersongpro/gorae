<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공문 할 일 추출기</title>
<style>
  :root { --b: #3366ff; --tx: #171719; --mu: #5a5c63; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f7f7f8; color: var(--tx); font: 16px/1.6 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
  @media (min-width: 800px) { .wrap { grid-template-columns: 1fr 1fr; } header { grid-column: 1 / -1; } }
  h1 { font-size: 1.3rem; margin: 0; } .sub { margin: 2px 0 0; color: var(--mu); font-size: .9rem; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(23,23,23,.08); display: grid; gap: 8px; align-content: start; }
  textarea { width: 100%; min-height: 260px; font: inherit; padding: 10px; border: 1px solid #e1e2e4; border-radius: 10px; resize: vertical; }
  .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 700; min-height: 46px; padding: 0 18px; border: 1px solid #e1e2e4; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); border-color: var(--b); color: #fff; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #7aa0ff; outline-offset: 2px; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; } .item.d span.t { text-decoration: line-through; color: var(--mu); }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; margin-right: 6px; background: #eef2ff; color: #0054d1; }
  .tag.due { background: #ffe9e9; color: #b00c0c; } .tag.who { background: #e6f8fc; color: #00788c; }
  h2 { font-size: 1.05rem; margin: 6px 0 0; } .none { color: var(--mu); }
.item{display:block}.item input[type=text]{width:100%;font:inherit;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:8px}.item small{display:block}.item textarea{min-height:70px}.reviewed{color:#146044}</style>
</head>
<body>
<div class="wrap">
  <header><h1>📑 공문 할 일 추출기</h1><p class="sub">공문 본문을 붙여 넣으면 기한·제출·대상이 들어 있는 문장을 후보로 골라요. 원문을 확인하고 업무·기한·담당을 직접 수정하세요. 내용은 이 화면 밖으로 나가지 않아요.</p></header>
  <section class="card" aria-label="공문 붙여넣기">
    <label for="src"><strong>공문 내용</strong></label>
    <textarea id="src">1. 관련: 교육지원청 학교안전과-1234(2026. 9. 20.)
2. 2026학년도 학생 안전교육 실시 결과를 아래와 같이 제출하여 주시기 바랍니다.
가. 제출 기한: 2026. 10. 15.(목)까지
나. 제출 방법: 업무관리시스템 문서 등록 및 결과표 첨부
다. 대상: 전 학급 담임교사
3. 안전교육은 10월 중 학급별로 2차시 이상 실시하여야 합니다.
4. 결과표는 학년 부장이 취합하여 교무부에 제출하시기 바랍니다.
붙임 결과표 서식 1부. 끝.</textarea>
    <div class="r"><button class="p" id="go">후보 뽑기</button><button id="add">직접 추가</button><button id="copy">목록 복사</button></div>
    <p class="sub">공문의 이름·학생 정보는 붙여 넣지 말고, 업무에 필요한 부분만 넣어 주세요.</p>
  </section>
  <section class="card" aria-label="할 일 목록"><p>규칙으로 추출한 후보이므로 누락·오탐이 있을 수 있어요. 기한과 담당을 원문과 대조한 후 사용하세요.</p><div id="out" aria-live="polite"></div><label for="result">복사·보관할 업무 목록</label><textarea id="result" readonly></textarea></section>
</div>
<script>
const $=id=>document.getElementById(id);
const DUE=/(\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.?(?:\([월화수목금토일]\))?\s*(?:까지)?|\d{1,2}월\s*\d{1,2}일(?:\([월화수목금토일]\))?\s*(?:까지)?|이번\s*주|다음\s*주|월말|\d{1,2}월\s*중)/;
const ACT=/(제출|보고|회신|취합|등록|신청|실시|참석|확인하여|작성|공유|배부|안내)/;
const WHO=/(담임교사|교과\s*담당|학년\s*부장|부장교사|업무\s*담당자?|전\s*교직원|교무부|행정실|전\s*학급)/;
let items=[];
function exportText(){ $('result').value=items.map(it=>(it.done?'☑ ':'□ ')+it.task+'\n  기한: '+(it.due||'원문 확인 필요')+' / 담당: '+(it.who||'지정 필요')+' / 원문 대조: '+(it.reviewed?'완료':'미확인')+'\n  근거: '+(it.line?'원문 '+it.line+'행 '+it.original:'직접 추가')).join('\n\n'); }
function parse(){items=$('src').value.split(/\n/).map((v,i)=>({v:v.trim(),line:i+1})).filter(x=>x.v&&!/관련\s*:/.test(x.v)&&(ACT.test(x.v)||/(기한|마감)/.test(x.v))).map(x=>({task:x.v,original:x.v,line:x.line,due:(x.v.match(DUE)||[])[0]||'',who:(x.v.match(WHO)||[])[0]||'',done:false,reviewed:false}));draw();}
function draw(){const out=$('out');out.textContent='';const h=document.createElement('h2');h.textContent='업무 후보 '+items.length+'건 · 원문 대조 '+items.filter(i=>i.reviewed).length+'건';out.append(h);
if(!items.length){const p=document.createElement('p');p.textContent='후보가 없어요. 원문을 확인하고 직접 추가하세요.';out.append(p);}
items.forEach((it,i)=>{const row=document.createElement('div');row.className='item';const ref=document.createElement('small');ref.textContent=it.line?'원문 '+it.line+'행: '+it.original:'직접 추가한 업무';row.append(ref);
for(const [key,label] of [['task','할 일'],['due','기한'],['who','담당']]){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.type='text';input.value=it[key];input.oninput=()=>{it[key]=input.value;exportText();};l.append(input);row.append(l);}
for(const [key,label] of [['reviewed','원문과 기한·담당 대조 완료'],['done','업무 완료']]){const l=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=it[key];check.onchange=()=>{it[key]=check.checked;draw();};l.append(check,document.createTextNode(label));row.append(l);}
const remove=document.createElement('button');remove.textContent='이 후보 제외';remove.onclick=()=>{items.splice(i,1);draw();};row.append(remove);out.append(row);});exportText();}
$('go').onclick=parse;$('add').onclick=()=>{items.push({task:'',due:'',who:'',original:'',line:0,done:false,reviewed:false});draw();};
$('copy').onclick=async()=>{exportText();try{await navigator.clipboard.writeText($('result').value);$('copy').textContent='복사했어요';}catch{$('copy').textContent='아래 목록을 선택해 복사하세요';}};parse();
</script>
</body>
</html>
