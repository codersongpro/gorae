<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가정통신문 만들기</title>
<style>
  :root { --b: #00788c; --tx: #171719; --mu: #5a5c63; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f7f7f8; color: var(--tx); font: 16px/1.7 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
  @media (min-width: 800px) { .wrap { grid-template-columns: 340px 1fr; } header { grid-column: 1 / -1; } }
  h1 { font-size: 1.3rem; margin: 0; } .sub { margin: 2px 0 0; color: var(--mu); font-size: .9rem; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(23,23,23,.08); display: grid; gap: 6px; align-content: start; }
  input[type=text], input[type=date], textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #e1e2e4; border-radius: 10px; } textarea { min-height: 80px; }
  label { font-weight: 700; font-size: .92rem; }
  .r { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-weight: 700; min-height: 46px; padding: 0 16px; border: 1px solid #e1e2e4; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); border-color: var(--b); color: #fff; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #5cc7da; outline-offset: 2px; }
  .paper { background: #fff; border: 1px solid #e1e2e4; padding: 32px 28px; border-radius: 6px; min-height: 420px; }
  .paper h2 { text-align: center; font-size: 1.5rem; margin: 0 0 4px; } .paper .no { text-align: center; color: var(--mu); margin-bottom: 14px; }
  .paper table { border-collapse: collapse; width: 100%; margin: 10px 0; } .paper th, .paper td { border: 1px solid #c9c9c9; padding: 6px 10px; text-align: left; } .paper th { background: #f3f6f7; width: 7em; }
  .sign { text-align: center; margin-top: 24px; font-size: 1.15rem; font-weight: 700; } .reply { margin-top: 20px; border-top: 2px dashed #999; padding-top: 10px; }
  @media print { body { background: #fff; padding: 0; } .noprint { display: none !important; } .paper { border: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="noprint"><h1>✉️ 가정통신문 만들기</h1><p class="sub">행사 정보를 넣으면 가정통신문 서식이 만들어져요. 인쇄하거나 글만 복사해 학교 앱에 붙여 넣을 수 있어요. 학생·학부모 개인정보는 넣지 않아요.</p></header>
  <section class="card noprint" aria-label="입력">
    <label for="school">학교(학년/반)</label><input type="text" id="school" value="푸른초등학교 4학년">
    <label for="title">제목</label><input type="text" id="title" value="현장체험학습 안내">
    <label for="date">행사 날짜</label><input type="date" id="date" value="2026-11-12">
    <label for="place">장소</label><input type="text" id="place" value="국립과학관">
    <label for="time">시간</label><input type="text" id="time" value="오전 9시 ~ 오후 3시">
    <label for="bring">준비물</label><input type="text" id="bring" value="도시락, 물, 편한 운동화, 모자">
    <label for="cost">참가비</label><input type="text" id="cost" value="없음 (학교 예산)">
    <label for="note">안내 말씀</label><textarea id="note">비가 오는 경우 일정이 변경될 수 있습니다. 알레르기가 있는 경우 담임교사에게 알려 주세요.</textarea>
    <label for="dead">회신 마감</label><input type="date" id="dead" value="2026-11-05">
    <div class="r"><button class="p" id="make">통신문 만들기</button><button id="copy">글만 복사</button><button id="pr">인쇄</button></div>
  </section>
  <section class="paper" id="paper" aria-live="polite"></section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => { if (!v) return ''; const d = new Date(v + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`; };
  let text = '';
  function make() {
    const p = $('paper'); p.textContent = '';
    const add = (tag, txt, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = txt; p.appendChild(e); return e; };
    add('h2', $('title').value.trim());
    add('p', '학부모님께', 'no');
    add('p', `학부모님의 가정에 건강과 행복이 가득하기를 바랍니다. 우리 학교 ${$('school').value.trim()}에서는 아래와 같이 행사를 실시하오니 안내해 드립니다.`);
    const rows = [['일시', `${fmt($('date').value)} ${$('time').value.trim()}`], ['장소', $('place').value.trim()], ['준비물', $('bring').value.trim()], ['참가비', $('cost').value.trim()]];
    const tb = document.createElement('table');
    rows.forEach(([k, v]) => { const tr = document.createElement('tr'); const th = document.createElement('th'); th.textContent = k; const td = document.createElement('td'); td.textContent = v; tr.append(th, td); tb.appendChild(tr); });
    p.appendChild(tb);
    if ($('note').value.trim()) add('p', '※ ' + $('note').value.trim());
    add('p', `참가 여부는 ${fmt($('dead').value)}까지 알려 주시기 바랍니다.`);
    add('div', `${new Date().getFullYear()}년 ${new Date().getMonth() + 1}월 ${new Date().getDate()}일\n${$('school').value.trim()} 담임교사 드림`, 'sign').style.whiteSpace = 'pre-line';
    const rp = document.createElement('div'); rp.className = 'reply';
    rp.textContent = '✂ ------ 회신서 ------\n'; rp.style.whiteSpace = 'pre-line';
    rp.appendChild(document.createTextNode(`${$('title').value.trim()}에  ( ) 참가합니다.  ( ) 참가하지 않습니다.\n보호자 확인:               (서명)`));
    p.appendChild(rp);
    text = [$('title').value.trim(), '', `학부모님께`, '', `일시: ${fmt($('date').value)} ${$('time').value.trim()}`, `장소: ${$('place').value.trim()}`, `준비물: ${$('bring').value.trim()}`, `참가비: ${$('cost').value.trim()}`, '', $('note').value.trim() ? '※ ' + $('note').value.trim() : '', `참가 여부는 ${fmt($('dead').value)}까지 알려 주세요.`, '', `${$('school').value.trim()} 담임교사 드림`].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');
  }
  $('make').onclick = make; $('pr').onclick = () => window.print();
  $('copy').onclick = async () => { make(); try { await navigator.clipboard.writeText(text); $('copy').textContent = '복사했어요 ✓'; } catch { $('copy').textContent = '복사하지 못했어요'; } setTimeout(() => { $('copy').textContent = '글만 복사'; }, 1800); };
  make();
</script>
</body>
</html>
