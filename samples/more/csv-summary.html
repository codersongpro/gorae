<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설문 CSV 응답 집계기</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#14324a;font:18px/1.6 'Malgun Gothic',system-ui}main{max-width:900px;margin:auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:18px}button,select,textarea{font:inherit;max-width:100%;min-height:44px;padding:10px;border:1px solid #aac6d8;border-radius:9px}button{cursor:pointer;background:#e7f1f9;margin:4px}label{display:block;margin:12px 0}textarea{width:100%;min-height:150px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #aac6d8;overflow-wrap:anywhere}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #aa6500}@media(max-width:440px){main{padding:12px}section{padding:14px}}
</style></head><body><main><h1>설문 CSV를 항목별로 집계하기</h1><p>교사 업무 · 외부 전송 없이 현재 화면에서 처리 · 실제 응답에서 식별정보를 제거한 뒤 넣으세요.</p><section><label>CSV 본문<textarea id="csv">활동,만족도,의견
탐구,만족,"설명이 좋아요, 다음에도 해요"
발표,보통,시간이 짧아요
탐구,만족,짝 활동이 좋아요
토론,매우 만족,근거를 찾았어요</textarea></label><button id="parse">표 읽기</button><label>집계할 열<select id="column"></select></label><p id="message" aria-live="polite"></p></section><section><h2>항목별 빈도</h2><div class="table-wrap"><table><thead><tr><th>응답</th><th>건수</th><th>비율</th></tr></thead><tbody id="summary"></tbody></table></div><label>붙여넣기용 결과<textarea id="result" readonly></textarea></label><button id="clear">입력·결과 모두 지우기</button></section><section><h2>업무에 사용하기 전</h2><p>총 응답 수와 빈칸 수를 확인하세요. 숫자처럼 보이는 항목도 범주로 집계합니다. 복수 선택 응답은 한 셀을 하나의 범주로 읽어요. 표를 수동 확인한 뒤 보고서에 붙여 넣으세요.</p></section></main><script>
const $=id=>document.getElementById(id);let rows=[];function parseCsv(text){const out=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(c===','&&!quote){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell='';}else cell+=c;}if(quote)throw new Error('따옴표가 닫히지 않았어요.');row.push(cell);if(row.some(v=>v.trim()))out.push(row);return out;}
function count(){if(rows.length<2)return;const idx=+$('column').value,counts=new Map();for(const row of rows.slice(1)){const v=(row[idx]||'').trim()||'(빈칸)';counts.set(v,(counts.get(v)||0)+1);}$('summary').replaceChildren();const total=rows.length-1,lines=['항목\t건수\t비율'];for(const [v,n] of [...counts].sort((a,b)=>b[1]-a[1])){const pct=(n/total*100).toFixed(1)+'%',tr=document.createElement('tr');[v,n,pct].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.append(td);});$('summary').append(tr);lines.push(v+'\t'+n+'\t'+pct);}$('result').value='총 응답 '+total+'건\n'+lines.join('\n');}
$('parse').onclick=()=>{try{rows=parseCsv($('csv').value.replace(/^\uFEFF/,''));if(rows.length<2)throw new Error('머리글과 응답 1행 이상이 필요해요.');if(rows.length>10001)throw new Error('1만 행까지만 처리해요.');if(rows.some(r=>r.length!==rows[0].length))throw new Error('열 개수가 다른 행이 있어요. 원본을 확인하세요.');$('column').replaceChildren();rows[0].forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v||'열 '+(i+1);$('column').append(o);});$('message').textContent='응답 '+(rows.length-1)+'건 · '+rows[0].length+'개 열';count();}catch(e){rows=[];$('column').replaceChildren();$('summary').replaceChildren();$('result').value='';$('message').textContent=e.message;}};
$('column').onchange=count;$('clear').onclick=()=>{rows=[];$('csv').value='';$('result').value='';$('column').replaceChildren();$('summary').replaceChildren();$('message').textContent='입력과 결과를 지웠어요.';};$('parse').click();
</script></body></html>
