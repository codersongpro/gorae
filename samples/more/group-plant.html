<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식물 관찰 기록 발표판</title>
<style>
  :root { --b: #2e7d32; --tx: #1b2e1c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f1f8e9; color: var(--tx); font: 16px/1.6 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; } .sub { margin: 2px 0 0; color: #4d6b4e; font-size: .9rem; }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 4px rgba(23,23,23,.1); display: grid; gap: 8px; }
  input[type=text], textarea, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #c9deca; border-radius: 10px; } textarea { min-height: 64px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 700; min-height: 46px; padding: 0 16px; border: 1px solid #c9deca; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); border-color: var(--b); color: #fff; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #81c784; outline-offset: 2px; }
  .timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .day { background: #fff; border-radius: 14px; border-top: 6px solid var(--b); padding: 12px; display: grid; gap: 4px; box-shadow: 0 1px 4px rgba(23,23,23,.1); }
  .day .stage { font-size: 2.4rem; text-align: center; } .day h3 { margin: 0; font-size: 1rem; color: var(--b); } .day p { margin: 0; }
  .grow { height: 14px; border-radius: 999px; background: #dcedc8; overflow: hidden; } .grow i { display: block; height: 100%; background: var(--b); }
  body.present .editor { display: none; } body.present .day { font-size: 1.15rem; }
  .learn { background: #fff8e1; border-radius: 14px; padding: 12px 16px; border-left: 6px solid #f9a825; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🌱 식물 관찰 기록 발표판</h1><p class="sub">4학년 과학 · 식물의 한살이. 모둠이 날짜별로 관찰한 내용을 모아 한눈에 발표해요. 사진이나 이름은 넣지 않아요.</p></header>
  <section class="card editor" aria-label="기록 입력">
    <label for="plant"><strong>관찰한 식물</strong></label><input type="text" id="plant" value="강낭콩">
    <div class="row"><label>날짜(며칠째) <input type="text" id="d" value="1" size="3" inputmode="numeric"></label>
      <label>모습 <select id="st"><option value="🫘">씨앗</option><option value="🌱">싹이 터요</option><option value="🌿">잎이 나요</option><option value="🌼">꽃이 펴요</option><option value="🫛">열매가 열려요</option></select></label>
      <label>키(cm) <input type="text" id="h" value="0" size="4" inputmode="decimal"></label></div>
    <label for="memo"><strong>관찰한 내용</strong></label><textarea id="memo" placeholder="예: 껍질이 갈라지고 하얀 뿌리가 나왔어요."></textarea>
    <div class="row"><button class="p" id="add">기록 추가</button><button id="undo">마지막 기록 지우기</button><button id="sample">예시 채우기</button></div>
    <label for="learn"><strong>우리 모둠이 알게 된 점</strong></label><textarea id="learn">씨앗에서 싹이 나려면 물과 따뜻한 온도가 필요해요.</textarea>
  </section>
  <section aria-label="발표">
    <div class="row"><h2 id="title" style="margin:0;font-size:1.2rem"></h2><button id="pres" style="margin-left:auto">발표 화면 켜기/끄기</button></div>
    <div class="timeline" id="tl"></div>
    <div class="learn" id="lr"></div>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let rec = [];
  function draw() {
    $('title').textContent = `${$('plant').value.trim() || '식물'} 관찰 기록 (${rec.length}번)`;
    const tl = $('tl'); tl.textContent = '';
    const maxH = Math.max(1, ...rec.map((r) => r.h));
    rec.slice().sort((a, b) => a.d - b.d).forEach((r) => {
      const d = document.createElement('div'); d.className = 'day';
      const s = document.createElement('div'); s.className = 'stage'; s.textContent = r.st;
      const t = document.createElement('h3'); t.textContent = `${r.d}일째 · 키 ${r.h}cm`;
      const g = document.createElement('div'); g.className = 'grow'; const gi = document.createElement('i'); gi.style.width = `${(r.h / maxH) * 100}%`; g.appendChild(gi);
      const p = document.createElement('p'); p.textContent = r.memo;
      d.append(s, t, g, p); tl.appendChild(d);
    });
    $('lr').textContent = rec.length ? `💡 알게 된 점: ${$('learn').value.trim()}` : '기록을 추가하면 여기에 모여요.';
  }
  $('add').onclick = () => { rec.push({ d: Math.max(0, +$('d').value || 0), st: $('st').value, h: Math.max(0, +$('h').value || 0), memo: $('memo').value.trim() || '(적은 내용 없음)' }); $('memo').value = ''; $('d').value = String((+$('d').value || 0) + 1); draw(); };
  $('undo').onclick = () => { rec.pop(); draw(); };
  $('sample').onclick = () => { rec = [{ d: 1, st: '🫘', h: 0, memo: '물에 불린 콩이 두 배로 커졌어요.' }, { d: 4, st: '🌱', h: 2, memo: '뿌리가 먼저 나오고 싹이 올라왔어요.' }, { d: 9, st: '🌿', h: 8, memo: '떡잎이 펴지고 본잎이 나왔어요.' }, { d: 25, st: '🌼', h: 30, memo: '덩굴이 자라 보라색 꽃이 피었어요.' }]; draw(); };
  $('pres').onclick = () => document.body.classList.toggle('present');
  $('learn').addEventListener('input', draw); $('plant').addEventListener('input', draw);
  $('sample').click();
</script>
</body>
</html>
