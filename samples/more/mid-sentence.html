<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 문장 순서 퍼즐</title>
<style>
  :root { --b: #5b37ed; --tx: #1c1633; --mu: #5d5380; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f3efff; color: var(--tx); font: 16px/1.6 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; } .sub { margin: 2px 0 0; color: var(--mu); font-size: .9rem; }
  .card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 4px rgba(28,22,51,.12); display: grid; gap: 10px; }
  .top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-weight: 700; color: var(--mu); }
  .ko { font-size: 1.2rem; font-weight: 800; }
  .slot, .bank { min-height: 64px; border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .slot { border: 2px dashed #c9bdf5; background: #faf8ff; } .bank { background: #f3efff; }
  .chip { font: inherit; font-size: 1.1rem; font-weight: 700; min-height: 46px; padding: 0 14px; border: 1px solid #cfc3f7; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  .chip:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #a99af7; outline-offset: 2px; }
  .slot.ok { border-color: #2e7d32; background: #edf7ee; } .slot.no { border-color: #c62828; background: #fdecec; }
  .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.act { font: inherit; font-weight: 700; min-height: 46px; padding: 0 16px; border: 1px solid #cfc3f7; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; } button.p { background: var(--b); border-color: var(--b); color: #fff; }
  select { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid #cfc3f7; } #fb { font-weight: 800; min-height: 1.6em; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🧩 영어 문장 순서 퍼즐</h1><p class="sub">중2 영어 · 문장의 어순. 흩어진 낱말 카드를 눌러 우리말 뜻에 맞는 영어 문장으로 만들어요.</p></header>
  <section class="card" aria-label="퍼즐">
    <div class="top"><label>단계 <select id="lv"><option value="1">쉬움 (4~5낱말)</option><option value="2" selected>보통 (6~7낱말)</option><option value="3">어려움 (8낱말 이상)</option></select></label><span id="sc">0 / 0</span></div>
    <div class="ko" id="ko"></div>
    <div class="slot" id="slot" aria-label="만든 문장" aria-live="polite"></div>
    <div class="bank" id="bank" aria-label="낱말 카드"></div>
    <div class="r"><button class="act p" id="chk">확인</button><button class="act" id="undo">되돌리기</button><button class="act" id="hint">힌트(첫 낱말)</button><button class="act" id="next">다음 문제 ▶</button></div>
    <div id="fb" role="status" aria-live="polite"></div>
  </section>
</div>
<script>
  const BANK = {
    1: [['나는 매일 아침 운동해요.', 'I exercise every morning.'], ['그녀는 책을 읽고 있어요.', 'She is reading a book.'], ['우리는 학교에 걸어가요.', 'We walk to school.'], ['그는 고양이를 키워요.', 'He has a cat.']],
    2: [['나는 어제 친구와 영화를 봤어요.', 'I watched a movie with my friend yesterday.'], ['그 소년은 나보다 빨리 달릴 수 있어요.', 'The boy can run faster than me.'], ['우리는 내일 박물관에 갈 거예요.', 'We will go to the museum tomorrow.'], ['그녀는 어렸을 때 피아노를 쳤어요.', 'She played the piano when she was young.']],
    3: [['내가 어제 산 책은 매우 재미있어요.', 'The book that I bought yesterday is very interesting.'], ['선생님은 우리에게 숙제를 내 주셨어요.', 'Our teacher gave us a lot of homework to do.'], ['비가 오면 나는 집에서 책을 읽을 거예요.', 'If it rains I will stay home and read a book.']],
  };
  const $ = (id) => document.getElementById(id);
  const rand = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  let cur, built, pool, solved = 0, tried = 0, hinted = false;
  const words = (s) => s.replace(/[.,]/g, '').split(' ');
  function next() {
    const list = BANK[$('lv').value]; cur = list[rand(list.length)];
    const w = cur[1].split(' '); pool = w.map((t, i) => ({ t, i })).sort(() => rand(3) - 1); built = []; hinted = false;
    $('ko').textContent = cur[0]; $('fb').textContent = ''; $('slot').className = 'slot'; draw();
  }
  function draw() {
    const mk = (box, arr, fn) => { box.textContent = ''; arr.forEach((o) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o.t; b.onclick = () => fn(o); box.appendChild(b); }); };
    mk($('slot'), built, (o) => { built = built.filter((x) => x !== o); pool.push(o); draw(); });
    mk($('bank'), pool, (o) => { pool = pool.filter((x) => x !== o); built.push(o); $('slot').className = 'slot'; draw(); });
    $('sc').textContent = `${solved} / ${tried}`;
  }
  const want = () => cur[1].split(' ');
  $('chk').onclick = () => {
    if (built.length !== want().length) { $('fb').textContent = '낱말을 모두 놓아 주세요.'; return; }
    tried++; const ok = built.map((o) => o.t).join(' ') === cur[1];
    if (ok) { solved++; $('slot').className = 'slot ok'; $('fb').textContent = '⭕ 정답이에요! ' + cur[1]; } else { $('slot').className = 'slot no'; $('fb').textContent = '❌ 어순을 다시 살펴봐요. 주어 → 동사 → 나머지 순서를 생각해 보세요.'; }
    draw();
  };
  $('undo').onclick = () => { const o = built.pop(); if (o) { pool.push(o); draw(); } };
  $('hint').onclick = () => { $('fb').textContent = `첫 낱말은 "${want()[0]}" 예요.`; };
  $('next').onclick = next; $('lv').onchange = next;
  next();
</script>
</body>
</html>
