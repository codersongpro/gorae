<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>곱셈 연습 카드</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#14324a;font:18px/1.6 'Malgun Gothic',system-ui}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:18px}button,input,textarea{font:inherit;max-width:100%;min-height:44px;padding:10px;border:1px solid #aac6d8;border-radius:9px}button{cursor:pointer;background:#e7f1f9;margin:4px}button:disabled{opacity:.5}label{display:block;margin:12px 0}textarea{width:100%;min-height:100px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #aa6500}[hidden]{display:none!important}@media(max-width:440px){main{padding:12px}section{padding:14px}}
</style></head><body><main><h1>자릿값으로 풀어 보는 곱셈 카드</h1><p>초4 수학 · 짝 활동 10분 · 한 명은 계산하고 한 명은 풀이를 설명해요.</p><section><h2 id="problem"></h2><label>내 계산<input id="answer" type="number" inputmode="numeric"></label><button id="check">풀이 확인</button><button id="hint">자릿값 힌트</button><p id="feedback" aria-live="polite"></p><div id="steps" hidden></div><button id="next" disabled>다음 카드</button><p id="score"></p></section><section><h2>짝에게 설명하기</h2><p>“십의 자리 계산에서 왜 0을 붙이나요?”를 서로 설명하세요. 결과가 같아도 계산 과정을 비교해 보세요.</p><label>알게 된 계산 방법<textarea id="reflection"></textarea></label></section></main><script>
const $=id=>document.getElementById(id);const bank=[[124,3],[213,4],[156,6],[208,7],[325,4],[142,12],[216,23],[304,15]];let i=0,checked=false,correct=0;
function show(){const [a,b]=bank[i];$('problem').textContent=(i+1)+'/'+bank.length+' · '+a+' × '+b;$('answer').value='';$('feedback').textContent='';$('steps').hidden=true;checked=false;$('check').disabled=false;$('hint').disabled=false;$('next').disabled=true;const tens=Math.floor(b/10)*10,ones=b%10;$('steps').textContent=tens?a+'×'+ones+'='+a*ones+' / '+a+'×'+tens+'='+a*tens+' → 두 부분을 더하면 '+a*b:(Math.floor(a/100)*100)+'×'+b+' + '+(Math.floor(a/10)%10*10)+'×'+b+' + '+a%10+'×'+b+' = '+a*b;}
$('check').onclick=()=>{if(checked)return;if(!$('answer').value.trim()){$('feedback').textContent='계산한 값을 입력하세요.';return;}checked=true;const [a,b]=bank[i],ok=Number($('answer').value)===a*b;if(ok)correct++;$('feedback').textContent=ok?'정답이에요. 짝에게 계산 과정을 설명하세요.':'정답은 '+a*b+'. 자릿값 풀이를 보고 계산을 다시 해 보세요.';$('steps').hidden=false;$('check').disabled=true;$('next').disabled=false;$('score').textContent='첫 확인 정답 '+correct+' / '+(i+1);};
$('hint').onclick=()=>{$('steps').hidden=false;};$('next').onclick=()=>{if(i===bank.length-1){$('feedback').textContent='8장 완료! 계산 방법을 정리하세요.';$('next').disabled=true;return;}i++;show();};show();
</script></body></html>
