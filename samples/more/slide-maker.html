<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 장씩 발표 슬라이드 만들기</title>
<style>
  :root { --b: #5b37ed; --tx: #171719; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #f7f7f8; color: var(--tx); font: 16px/1.5 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 12px; }
  @media (min-width: 800px) { .wrap { grid-template-columns: 360px 1fr; } header { grid-column: 1 / -1; } }
  h1 { font-size: 1.25rem; margin: 0; } .sub { margin: 2px 0 0; color: #5a5c63; font-size: .9rem; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(23,23,23,.08); display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 260px; font: inherit; padding: 10px; border: 1px solid #e1e2e4; border-radius: 10px; resize: vertical; }
  #view { min-height: 300px; border-radius: 16px; padding: clamp(16px, 4vw, 40px); display: grid; align-content: center; gap: 8px; color: #fff; transition: background .3s; }
  #view h2 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.3; } #view li, #view p { font-size: clamp(1.05rem, 3vw, 1.5rem); margin: 0; } #view ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border: 1px solid #e1e2e4; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); color: #fff; border-color: var(--b); }
  button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #a99af7; outline-offset: 2px; }
  select { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid #e1e2e4; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎞️ 발표 슬라이드 만들기</h1><p class="sub">줄을 쓰면 슬라이드가 돼요. 이름이나 학교 같은 개인정보는 적지 않아요.</p></header>
  <section class="card" aria-label="내용 쓰기">
    <label for="src"><strong>내용</strong> — 첫 줄은 제목, 다음 줄들은 내용, 빈 줄 한 번으로 다음 장</label>
    <textarea id="src"># 우리 모둠이 고른 동물
고래는 포유류예요
숨을 쉬러 물 위로 올라와요

# 왜 이 동물일까?
노래로 서로 이야기해요
가족과 함께 다녀요
몸이 가장 큰 동물이에요

# 고마워요
궁금한 점을 물어보세요</textarea>
    <div class="r"><label>색 <select id="theme"><option value="0">파랑</option><option value="1">초록</option><option value="2">보라</option><option value="3">주황</option></select></label>
      <button id="clear" type="button">모두 지우기</button></div>
  </section>
  <section class="card" aria-label="미리 보기">
    <div id="view" aria-live="polite"></div>
    <div class="r"><button id="prev" type="button">◀ 이전</button><button id="next" class="p" type="button">다음 ▶</button><span id="cnt"></span></div>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const colors = [['#1b6ec2', '#0b3d75'], ['#1f8a52', '#0d5230'], ['#5b37ed', '#33198f'], ['#d96b00', '#8a3f00']];
  let i = 0;
  function parse() {
    return $('src').value.split(/\n\s*\n/).map((blk) => blk.split('\n').map((s) => s.trim()).filter(Boolean)).filter((l) => l.length)
      .map((l) => ({ title: l[0].replace(/^#\s*/, ''), body: l.slice(1) }));
  }
  function draw() {
    const s = parse();
    if (!s.length) { $('view').textContent = '왼쪽에 내용을 써 보세요.'; $('view').style.background = '#8a94a0'; $('cnt').textContent = ''; return; }
    i = Math.max(0, Math.min(s.length - 1, i));
    const [a, b] = colors[+$('theme').value];
    const v = $('view'); v.textContent = ''; v.style.background = `linear-gradient(150deg, ${a}, ${b})`;
    const h = document.createElement('h2'); h.textContent = s[i].title; v.appendChild(h);
    if (s[i].body.length > 1) { const ul = document.createElement('ul'); s[i].body.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); }); v.appendChild(ul); }
    else if (s[i].body.length) { const p = document.createElement('p'); p.textContent = s[i].body[0]; v.appendChild(p); }
    $('cnt').textContent = `${i + 1} / ${s.length}장`;
  }
  $('prev').onclick = () => { i--; draw(); }; $('next').onclick = () => { i++; draw(); };
  $('src').addEventListener('input', draw); $('theme').addEventListener('change', draw);
  $('clear').onclick = () => { if (confirm('내용을 모두 지울까요?')) { $('src').value = ''; i = 0; draw(); } };
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });
  draw();
</script>
</body>
</html>
