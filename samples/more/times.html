<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구구단 번개 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#14324a;font:18px/1.6 'Malgun Gothic',system-ui}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:18px}button,input,select{font:inherit;max-width:100%;min-height:44px;padding:10px;border:1px solid #aac6d8;border-radius:9px}button{cursor:pointer;background:#e7f1f9;margin:4px}button.primary{background:#086784;color:white}button:disabled{opacity:.5}label{display:block;margin:12px 0}.feedback{min-height:56px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #aa6500}[hidden]{display:none!important}@media(max-width:440px){main{padding:12px}section{padding:14px}}
</style></head><body><main><h1>곱셈을 이해하고 구구단 복습하기</h1><p>5분 · 10문제 · 속도보다 정확한 설명을 먼저 해요.</p><section><label>연습할 단<select id="dan"><option value="0">2~9단 섞기</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label><button id="start">새 연습 시작</button></section>
<section><h2 id="q"></h2><p id="visual"></p><label>곱한 값<input id="answer" type="number" inputmode="numeric"></label><button id="check" class="primary">확인</button><button id="next" disabled>다음 문제</button><p id="feedback" class="feedback" aria-live="polite"></p><p id="stats"></p><button id="retry" hidden>오답만 다시 연습</button></section><section><h2>정리</h2><p>틀린 곱셈을 덧셈식으로 바꿔 공책에 적으세요. 예: 3 × 4 = 4 + 4 + 4.</p><div id="review"></div></section></main><script>
const $=id=>document.getElementById(id);let tasks=[],i=0,locked=false,correct=0,wrong=[];
function fresh(){const d=+$('dan').value;tasks=Array.from({length:10},()=>[d||2+Math.floor(Math.random()*8),2+Math.floor(Math.random()*8)]);i=0;correct=0;wrong=[];$('review').textContent='';$('retry').hidden=true;show();}
function show(){locked=false;const [a,b]=tasks[i];$('q').textContent=(i+1)+'/'+tasks.length+' · '+a+' × '+b+' = ?';$('visual').textContent=b+'개씩 '+a+'묶음. 묶음 수 × 한 묶음의 수를 생각하세요.';$('answer').value='';$('feedback').textContent='';$('check').disabled=false;$('next').disabled=true;}
$('check').onclick=()=>{if(locked)return;if(!$('answer').value.trim()){$('feedback').textContent='답을 먼저 입력해 주세요.';return;}locked=true;const [a,b]=tasks[i],ok=Number($('answer').value)===a*b;if(ok)correct++;else wrong.push(tasks[i]);$('feedback').textContent=(ok?'정답! ':'정답은 '+a*b+'. ')+Array(a).fill(b).join(' + ')+' = '+a*b;$('stats').textContent='이번 연습 정답 '+correct+'/'+tasks.length;$('check').disabled=true;$('next').disabled=false;};
$('next').onclick=()=>{i++;if(i<tasks.length)show();else{$('q').textContent='연습 완료';$('check').disabled=true;$('next').disabled=true;$('retry').hidden=!wrong.length;$('review').textContent=wrong.length?'다시 볼 곱셈: '+wrong.map(([a,b])=>a+'×'+b+'='+a*b).join(', '):'모든 문제를 해결했어요. 어려웠던 단도 다시 연습해 보세요.';}};
$('retry').onclick=()=>{tasks=wrong.slice();wrong=[];i=0;correct=0;$('retry').hidden=true;show();};$('dan').onchange=fresh;$('start').onclick=fresh;fresh();
</script></body></html>
