<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 타자 연습</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #eef5fb; color: #1f2328; }
  #target { font-size: 1.6rem; font-weight: 800; background: #fff; border-radius: 12px; padding: 14px; margin: 10px 0; }
  input { width: 100%; box-sizing: border-box; font-size: 1.4rem; padding: 10px; }
  #stat { font-size: 1.2rem; margin-top: 10px; }
</style>
</head>
<body>
<h1>⌨️ 한 줄 타자 연습</h1>
<div id="target"></div>
<input id="typing" aria-label="따라 치기" autocomplete="off">
<p id="stat" aria-live="polite">문장을 따라 치고 엔터를 누르세요.</p>
<script>
  const S = ['고래는 바다에서 노래를 불러요', '오늘도 즐겁게 코딩해요', '천천히 정확하게 치는 것이 먼저예요', '친구의 작품에 칭찬을 남겨요'];
  let i = 0, start = 0;
  const tgt = document.getElementById('target'), inp = document.getElementById('typing'), stat = document.getElementById('stat');
  const show = () => { tgt.textContent = S[i % S.length]; inp.value = ''; start = 0; };
  inp.addEventListener('input', () => { if (!start) start = performance.now(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const goal = S[i % S.length], typed = inp.value;
    let right = 0; for (let k = 0; k < goal.length; k++) if (typed[k] === goal[k]) right++;
    const sec = Math.max(1, (performance.now() - start) / 1000);
    stat.textContent = `정확도 ${Math.round((right / goal.length) * 100)}% · 분당 ${Math.round((typed.length / sec) * 60)}타`;
    i++; show();
  });
  show();
</script>
</body>
</html>
