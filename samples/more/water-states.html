<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물의 상태 변화 관찰</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#14324a;font:18px/1.6 'Malgun Gothic',system-ui}main{max-width:900px;margin:auto;padding:24px}section{background:white;padding:20px;margin:16px 0;border-radius:18px}button,input,textarea{font:inherit;max-width:100%;min-height:44px;padding:10px;border:1px solid #aac6d8;border-radius:9px}button{cursor:pointer;background:#e7f1f9;margin:4px}label{display:block;margin:12px 0}textarea{width:100%;min-height:100px}svg{width:100%;max-width:520px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #aac6d8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #aa6500}@media(max-width:440px){main{padding:12px}section{padding:14px}}
</style></head><body><main><h1>물의 상태와 입자 모형</h1><p>중1 과학 · 예측 → 관찰 → 비교 → 설명 · 20분</p><section><h2>모형의 조건</h2><p>1기압에서 순수한 물을 충분히 기다려 관찰하는 단순화 모형이에요. 실제 가열곡선이나 실험 측정값이 아닙니다. 0℃와 100℃에서는 두 상태가 함께 있을 수 있어요. 물은 100℃ 이하에서도 표면에서 증발해요.</p><label>먼저 예상하기<textarea id="prediction" placeholder="온도를 올리면 입자의 움직임은 어떻게 달라질까요?"></textarea></label></section><section><label>온도 <input id="temp" type="range" min="-20" max="120" value="20"></label><h2 id="state"></h2><svg id="particles" viewBox="0 0 420 180" role="img" aria-label="입자 배열 모형"></svg><p id="explain"></p><button id="record">관찰 기록 추가</button><button id="clear">기록 지우기</button><div class="table-wrap"><table><thead><tr><th>온도</th><th>상태</th><th>입자 배열 설명</th></tr></thead><tbody id="records"></tbody></table></div></section><section><h2>설명해 보기</h2><p>얼음이 물이 될 때 물질 자체가 다른 물질로 바뀌나요? 입자의 배열과 움직임을 사용해 설명하세요. 기체인 수증기는 눈에 보이지 않아요.</p><label>관찰한 점과 모형의 한계<textarea id="reflection"></textarea></label></section></main><script>
const $=id=>document.getElementById(id);function info(){const t=+$('temp').value;return {t,state:t===0?'고체와 액체 공존 가능':t===100?'액체와 기체 공존 가능':t<0?'고체 (얼음)':t<100?'액체 (물)':'기체 (수증기)',text:t<=0?'입자가 가까이 배열되고 제자리에서 진동하는 모형':t<100?'입자가 가까이 있지만 서로 위치를 바꾸는 모형':'입자가 멀리 떨어져 자유롭게 움직이는 모형'};}
function draw(){const m=info();$('state').textContent=m.t+'℃ · '+m.state;$('explain').textContent=m.text+' (공존 온도에서는 한 상태의 배열만 대표해 보여 주며, 입자 크기는 실제 비율과 다릅니다)';let s='';for(let i=0;i<24;i++){const gas=m.t>=100,solid=m.t<=0,x=gas?20+(i*83)%380:40+(i%8)*42,y=gas?20+(i*47)%140:50+Math.floor(i/8)*40+(solid?0:(i%3-1)*8);s+='<circle cx="'+x+'" cy="'+y+'" r="8" fill="#1588ac"/>';} $('particles').innerHTML=s;}
$('temp').oninput=draw;$('record').onclick=()=>{if($('records').children.length>=20)return;const m=info(),row=document.createElement('tr');[m.t+'℃',m.state,m.text].forEach(v=>{const td=document.createElement('td');td.textContent=v;row.append(td);});$('records').append(row);};$('clear').onclick=()=>$('records').replaceChildren();draw();
</script></body></html>
