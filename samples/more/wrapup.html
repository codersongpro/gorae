<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 마무리 성찰 카드</title>
<style>
  :root { --b: #5b37ed; --tx: #171719; --mu: #5a5c63; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #f4f0ff; color: var(--tx); font: 16px/1.6 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 1.3rem; margin: 0; } .sub { color: var(--mu); margin: 2px 0 0; font-size: .9rem; }
  #card { min-height: 40vh; background: #fff; border-radius: 24px; display: grid; place-items: center; text-align: center; padding: clamp(18px, 5vw, 44px); font-size: clamp(1.5rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.4; box-shadow: 0 2px 10px rgba(51,25,143,.15); }
  #card.pop { animation: pop .4s ease; } @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }
  .r { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; font-weight: 700; min-height: 50px; padding: 0 22px; border: 1px solid #d8cdfa; border-radius: 12px; background: #fff; color: var(--tx); cursor: pointer; }
  button.p { background: var(--b); border-color: var(--b); color: #fff; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #a99af7; outline-offset: 2px; }
  details { background: #fff; border-radius: 14px; padding: 12px 16px; } summary { cursor: pointer; font-weight: 700; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 10px; border: 1px solid #e1e2e4; border-radius: 10px; margin-top: 8px; }
  .cnt { text-align: center; color: var(--mu); }
  @media (prefers-reduced-motion: reduce) { #card.pop { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🌙 수업 마무리 성찰 카드</h1><p class="sub">수업 끝 5분. 카드를 뽑아 한 문장으로 말하거나 공책에 써요.</p></header>
  <div id="card" aria-live="polite">카드를 뽑아 보세요</div>
  <div class="cnt" id="cnt"></div>
  <div class="r"><button class="p" id="draw">질문 뽑기</button><button id="again">같은 질문 다시 보기</button></div>
  <details><summary>✏️ 질문 목록 고치기</summary>
    <label for="qs" class="sub">한 줄에 하나</label>
    <textarea id="qs">오늘 새로 알게 된 것은 무엇인가요?
오늘 가장 재미있었던 순간은 언제였나요?
아직 헷갈리는 것이 있다면 무엇인가요?
오늘 배운 것을 친구에게 한 문장으로 설명해 보세요.
오늘 배운 것을 어디에 쓸 수 있을까요?
오늘 나에게 도움이 된 친구의 말이나 행동은?
다음 시간에 더 해 보고 싶은 것은?
오늘 내 참여를 별 3개 중 몇 개로 줄까요? 이유는?</textarea></details>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const rand = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  let used = [], cur = '';
  const list = () => $('qs').value.split('\n').map((s) => s.trim()).filter(Boolean);
  function show(t) { const c = $('card'); c.textContent = t; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  $('draw').onclick = () => {
    const all = list(); if (!all.length) { show('질문 목록이 비어 있어요'); return; }
    let rest = all.filter((q) => !used.includes(q)); if (!rest.length) { used = []; rest = all; }
    cur = rest[rand(rest.length)]; used.push(cur); show(cur); $('cnt').textContent = `${used.length} / ${all.length}번째 질문`;
  };
  $('again').onclick = () => { if (cur) show(cur); };
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'TEXTAREA') return; if (e.code === 'Space') { e.preventDefault(); $('draw').click(); } });
</script>
</body>
</html>
