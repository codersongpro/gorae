<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠 편성기</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f3f8f6; color: #1f2328; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; font-size: 1rem; padding: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  button { font-size: 1.1rem; padding: 10px 18px; border-radius: 10px; border: 0; background: #3f7a76; color: #fff; cursor: pointer; }
  #out { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .g { background: #fff; border-radius: 12px; padding: 10px; border-top: 6px solid #3f7a76; }
  .g h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .g li { font-size: 1.1rem; }
</style>
</head>
<body>
<h1>👥 모둠 편성기</h1>
<p>한 줄에 하나씩(번호나 별명) 적고, 모둠 수 또는 모둠당 인원을 고르세요.</p>
<textarea id="list" aria-label="편성할 목록">1번
2번
3번
4번
5번
6번
7번
8번
9번
10번
11번
12번</textarea>
<div class="row">
  <label><input type="radio" name="by" value="groups" checked> 모둠 수</label>
  <label><input type="radio" name="by" value="size"> 모둠당 인원</label>
  <input type="number" id="n" min="1" max="30" value="4" style="width:4em" aria-label="숫자">
  <button id="go">편성하기</button>
</div>
<div id="out" aria-live="polite"></div>
<script>
  const rand = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  document.getElementById('go').onclick = () => {
    const people = shuffle(document.getElementById('list').value.split('\n').map((s) => s.trim()).filter(Boolean));
    const n = Math.max(1, +document.getElementById('n').value || 1);
    const by = document.querySelector('input[type=radio]:checked').value;
    const groups = Math.max(1, Math.min(people.length, by === 'groups' ? n : Math.ceil(people.length / n)));
    const out = Array.from({ length: groups }, () => []);
    people.forEach((p, i) => out[i % groups].push(p)); // 고르게 나눈다
    const box = document.getElementById('out');
    box.textContent = '';
    out.forEach((members, i) => {
      const card = document.createElement('div'); card.className = 'g';
      const h = document.createElement('h2'); h.textContent = (i + 1) + '모둠 (' + members.length + ')';
      const ul = document.createElement('ul');
      members.forEach((m) => { const li = document.createElement('li'); li.textContent = m; ul.appendChild(li); });
      card.append(h, ul); box.appendChild(card);
    });
  };
</script>
</body>
</html>
