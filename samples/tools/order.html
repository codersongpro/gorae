<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 순서 정하기</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fbf7f1; color: #1f2328; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  textarea { width: 100%; box-sizing: border-box; min-height: 100px; font-size: 1rem; padding: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  button { font-size: 1.1rem; padding: 10px 18px; border-radius: 10px; border: 0; background: #8a6d3b; color: #fff; cursor: pointer; }
  #now { font-size: clamp(2.5rem, 12vw, 5.5rem); font-weight: 800; text-align: center; background: #fff; border-radius: 16px; padding: 20px; margin: 12px 0; }
  ol { font-size: 1.15rem; columns: 2; }
  li.done { color: #9aa3ab; text-decoration: line-through; }
  li.cur { font-weight: 800; color: #8a6d3b; }
</style>
</head>
<body>
<h1>🎤 발표 순서 정하기</h1>
<textarea id="list" aria-label="발표할 목록">1모둠
2모둠
3모둠
4모둠
5모둠</textarea>
<div class="row">
  <button id="shuffle">순서 섞기</button>
  <button id="next">다음 발표!</button>
</div>
<div id="now" aria-live="polite">순서를 섞어 주세요</div>
<ol id="order"></ol>
<script>
  const rand = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  let order = []; let cur = -1;
  function draw() {
    const ol = document.getElementById('order'); ol.textContent = '';
    order.forEach((x, i) => { const li = document.createElement('li'); li.textContent = x; if (i < cur) li.className = 'done'; if (i === cur) li.className = 'cur'; ol.appendChild(li); });
    document.getElementById('now').textContent = cur < 0 ? '준비!' : cur < order.length ? order[cur] : '모두 발표했어요 👏';
  }
  document.getElementById('shuffle').onclick = () => {
    order = document.getElementById('list').value.split('\n').map((s) => s.trim()).filter(Boolean);
    for (let i = order.length - 1; i > 0; i--) { const j = rand(i + 1); [order[i], order[j]] = [order[j], order[i]]; }
    cur = -1; draw();
  };
  document.getElementById('next').onclick = () => { if (order.length && cur < order.length) cur++; draw(); };
</script>
</body>
</html>
