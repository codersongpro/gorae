<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OX 퀴즈</title>
<style>
  :root { --tx: #171719; --mu: #5a5c63; --b: #3366ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #f7f7f8; color: var(--tx); font: 16px/1.5 "Pretendard JP", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 1.3rem; margin: 0; } .sub { color: var(--mu); margin: 2px 0 0; font-size: .9rem; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(23,23,23,.08); display: grid; gap: 10px; }
  .top { display: flex; justify-content: space-between; color: var(--mu); font-weight: 700; }
  .prog { height: 8px; background: #eee; border-radius: 999px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--b); width: 0; transition: width .3s; }
  #q { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 800; min-height: 3.2em; display: grid; align-items: center; }
  .ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ox button { min-height: 110px; font: inherit; font-size: 3.4rem; font-weight: 800; border: 4px solid transparent; border-radius: 20px; color: #fff; cursor: pointer; }
  .o { background: #1b6ec2; } .x { background: #d93025; }
  .ox button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid #7aa0ff; outline-offset: 2px; }
  #fb { min-height: 3.2em; font-weight: 700; } #fb.ok { color: #1a7a42; } #fb.no { color: #b00c0c; }
  .nx { font: inherit; font-weight: 700; min-height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--b); color: #fff; cursor: pointer; justify-self: start; }
  .nx.g { background: #fff; color: var(--tx); border: 1px solid #e1e2e4; }
  textarea { width: 100%; min-height: 120px; font: inherit; padding: 10px; border: 1px solid #e1e2e4; border-radius: 10px; }
  details summary { cursor: pointer; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>⭕❌ OX 퀴즈</h1><p class="sub">문제를 읽고 O나 X를 눌러요. 키보드는 O, X 키로도 돼요.</p></header>
  <section class="card" aria-label="퀴즈">
    <div class="top"><span id="no"></span><span id="sc"></span></div>
    <div class="prog" aria-hidden="true"><i id="pg"></i></div>
    <div id="q" aria-live="polite"></div>
    <div class="ox"><button class="o" id="bo" aria-label="O 맞아요">O</button><button class="x" id="bx" aria-label="X 틀려요">X</button></div>
    <div id="fb" role="status"></div>
    <button class="nx" id="next">다음 문제 ▶</button>
  </section>
  <details class="card"><summary>✏️ 문제 직접 만들기 (선생님·모둠)</summary>
    <p class="sub">한 줄에 하나: <code>문제 | O 또는 X | 해설(선택)</code></p>
    <textarea id="src" aria-label="문제 목록"></textarea>
    <div class="r"><button class="nx" id="apply">이 문제로 시작</button> <button class="nx g" id="reset">처음 문제로 되돌리기</button></div>
  </details>
</div>
<script>
  const DEF = `고래는 물고기다. | X | 고래는 새끼에게 젖을 먹이는 포유류예요.
식물은 햇빛으로 스스로 양분을 만든다. | O | 광합성이라고 해요.
1/2은 1/3보다 크다. | O | 분모가 작을수록 한 조각이 커요.
물은 100℃에서 끓는다(보통의 높이에서). | O | 높은 산에서는 더 낮은 온도에서 끓어요.
우리나라의 수도는 부산이다. | X | 수도는 서울이에요.
삼각형의 세 각을 더하면 180도다. | O | 어떤 삼각형이든 같아요.`;
  const $ = (id) => document.getElementById(id);
  const parse = (t) => t.split('\n').map((l) => l.split('|').map((s) => s.trim())).filter((p) => p[0] && /^[OX]$/i.test(p[1] || '')).map((p) => ({ q: p[0], a: p[1].toUpperCase(), why: p[2] || '' }));
  let qs = [], i = 0, score = 0, answered = false;
  const rand = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  function start(list) { qs = [...list]; for (let k = qs.length - 1; k > 0; k--) { const j = rand(k + 1); [qs[k], qs[j]] = [qs[j], qs[k]]; } i = 0; score = 0; show(); }
  function show() {
    answered = false; $('fb').textContent = ''; $('fb').className = '';
    if (i >= qs.length) {
      $('q').textContent = `끝! ${qs.length}문제 중 ${score}문제를 맞혔어요 ${score === qs.length ? '🎉' : '👏'}`; $('bo').disabled = $('bx').disabled = true; $('next').textContent = '다시 하기 ↺'; $('pg').style.width = '100%'; $('no').textContent = ''; return;
    }
    $('q').textContent = qs[i].q; $('bo').disabled = $('bx').disabled = false; $('next').textContent = i === qs.length - 1 ? '결과 보기 ▶' : '다음 문제 ▶';
    $('no').textContent = `${i + 1} / ${qs.length}`; $('sc').textContent = `맞힌 수 ${score}`; $('pg').style.width = `${(i / qs.length) * 100}%`;
  }
  function pick(a) {
    if (answered || i >= qs.length) return; answered = true; const ok = qs[i].a === a; if (ok) score++;
    $('fb').className = ok ? 'ok' : 'no'; $('fb').textContent = (ok ? '⭕ 맞았어요! ' : `❌ 아쉬워요. 정답은 ${qs[i].a}예요. `) + qs[i].why; $('bo').disabled = $('bx').disabled = true; $('sc').textContent = `맞힌 수 ${score}`;
  }
  $('bo').onclick = () => pick('O'); $('bx').onclick = () => pick('X');
  $('next').onclick = () => { if (i >= qs.length) return start(qs); if (!answered && !confirm('답을 고르지 않았어요. 넘어갈까요?')) return; i++; show(); };
  $('apply').onclick = () => { const l = parse($('src').value); if (!l.length) { $('fb').className = 'no'; $('fb').textContent = '형식이 맞는 문제가 없어요. 예) 문제 | O | 해설'; return; } start(l); };
  $('reset').onclick = () => { $('src').value = DEF; start(parse(DEF)); };
  document.addEventListener('keydown', (e) => { if (e.target.tagName === 'TEXTAREA') return; if (e.key.toLowerCase() === 'o') pick('O'); if (e.key.toLowerCase() === 'x') pick('X'); });
  $('src').value = DEF; start(parse(DEF));
</script>
</body>
</html>
