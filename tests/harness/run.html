<!doctype html>
<!-- 개발 확인용: 새 탭 실행 화면(run.html)을 일반 브라우저에서 띄운다. sidebar 하네스와 같은 가짜 chrome을 쓴다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고래곳간 실행 (하네스)</title>
<base href="/extension/">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/app.css">
<style>body { height: 100vh; display: grid; grid-template-rows: auto 1fr; } #frame { border: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<header class="runbar" id="bar"><h1>🐳 고래곳간</h1><span class="muted" id="state">작품을 불러오는 중…</span></header>
<iframe id="frame" title="작품 실행" hidden></iframe>
<script>
  // 공개 주소 대신 이 저장소의 site/ 파일을 쓴다 (배포 전 변경 확인용)
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => realFetch(String(url).replace('https://codersongpro.github.io/gorae/', '/site/'), opts);
  // 목록 사본을 실제 확장앱처럼 localStorage에 보관하는 가짜 chrome
  window.chrome = {
    storage: { local: {
      get: async (k) => { const v = localStorage.getItem('h:' + k); return v == null ? {} : { [k]: JSON.parse(v) }; },
      set: async (o) => { for (const [k, v] of Object.entries(o)) localStorage.setItem('h:' + k, JSON.stringify(v)); },
    } },
    runtime: { getURL: (p) => '/extension/' + p },
    tabs: {
      create: (o) => { window.__lastTab = o; },
      // 메인 탭 주소는 localStorage 'h_tabUrl' 값으로 흉내 낸다
      query: async () => [{ url: localStorage.getItem('h_tabUrl') || '' }],
    },
  };
</script>
<script type="module" src="run.js"></script>
</body>
</html>
