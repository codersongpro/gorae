<!doctype html>
<!-- 개발 확인용: chrome.* 를 흉내 내어 확장앱 화면을 일반 브라우저에서 띄운다. 저장소 루트를 서버 루트로 열 것 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고래곳간 (하네스)</title>
<base href="/extension/">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<div id="app"></div>
<script>
  // 목록 사본을 실제 확장앱처럼 localStorage에 보관하는 가짜 chrome
  window.chrome = {
    storage: { local: {
      get: async (k) => { const v = localStorage.getItem('h:' + k); return v == null ? {} : { [k]: JSON.parse(v) }; },
      set: async (o) => { for (const [k, v] of Object.entries(o)) localStorage.setItem('h:' + k, JSON.stringify(v)); },
    } },
    runtime: { getURL: (p) => '/extension/' + p },
    tabs: { create: (o) => { window.__lastTab = o; } },
  };
</script>
<script type="module" src="sidebar.js"></script>
</body>
</html>
